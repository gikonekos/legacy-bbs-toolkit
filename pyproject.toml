[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-bbs-toolkit"
version = "0.1.0"
description = "日本語BBS過去ログのアーカイブ前処理基盤（実装） / Preprocessing foundation for legacy Japanese BBS archives (1999-2002 era)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "MOTOI Kenkichi" }
]
keywords = [
    "bbs",
    "archive",
    "japanese",
    "preprocessing",
    "digital-preservation",
    "html-parser",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Sociology :: History",
    "Topic :: Text Processing :: Markup :: HTML",
    "Natural Language :: Japanese",
]

[project.urls]
Homepage = "https://github.com/gikonekos/legacy-bbs-toolkit"
Repository = "https://github.com/gikonekos/legacy-bbs-toolkit"
Changelog = "https://github.com/gikonekos/legacy-bbs-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
legacy-bbs-toolkit = "legacy_bbs_toolkit.cli:main"

# Parser Plugin Namespace契約に基づくentry_points登録。
# グループ名は legacy_bbs_toolkit.parsers で固定。
# ここでの "kscrr1p9" はentry_point名（Pythonパッケージング上の識別子）で
# あり、Parser自身が持つ名前空間文字列（Kscrr1p9Parser.namespace =
# "legacy-bbs-toolkit.parser.kscrr1p9"）とは別物である点に注意。
# （旧名 "zantei"。対象スクリプト自体はzantei20070218のまま変更なし。）
[project.entry-points."legacy_bbs_toolkit.parsers"]
kscrr1p9 = "legacy_bbs_toolkit.parsers.kscrr1p9:Kscrr1p9Parser"
ksphp_plus = "legacy_bbs_toolkit.parsers.ksphp_plus:KsphpPlusParser"
remix = "legacy_bbs_toolkit.parsers.hr_boundary:RemixParser"
mizuiro = "legacy_bbs_toolkit.parsers.hr_boundary:MizuiroParser"
meiso = "legacy_bbs_toolkit.parsers.hr_boundary:MeisoParser"
ariake = "legacy_bbs_toolkit.parsers.hr_boundary:AriakeParser"

[tool.setuptools.packages.find]
where = ["src"]
